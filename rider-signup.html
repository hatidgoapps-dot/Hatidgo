<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>HatidGo – Rider Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0a; --card: #141414; --border: #2a2a2a;
      --accent: #f97316; --accent2: #fbbf24;
      --text: #f0f0f0; --muted: #777; --red: #ef4444; --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .wrap { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
    .logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; text-align: center; }
    .logo span { color: var(--accent); }
    .logo-sub { font-size: 12px; color: var(--muted); text-align: center; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
    .card-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input { width: 100%; background: #1a1a1a; border: 1.5px solid var(--border); border-radius: 12px; padding: 13px 15px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: #444; }
    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 13px; color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; }
    .btn:disabled { opacity: 0.5; }
    .msg { border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; display: none; }
    .msg.show { display: block; }
    .msg.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
    .msg.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
    .section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; margin-top: 4px; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { font-size: 12px; color: var(--muted); text-align: center; }
    .footer a { color: var(--accent); font-weight: 600; }
    .pending-box { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.3); border-radius: 16px; padding: 24px; text-align: center; display: none; }
    .pending-box.show { display: block; }
    .pending-icon { font-size: 48px; margin-bottom: 12px; }
    .pending-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--accent2); margin-bottom: 8px; }
    .pending-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">

  <div>
    <div class="logo">🛵 Hatid<span>Go</span></div>
    <div class="logo-sub">Rider Registration</div>
  </div>

  <!-- PENDING BOX -->
  <div class="pending-box" id="pendingBox">
    <div class="pending-icon">⏳</div>
    <div class="pending-title">Naghihintay ng Approval!</div>
    <div class="pending-sub">Nakita na ng Admin ang iyong application. Hintayin ang approval para makapag-login sa Rider app.</div>
  </div>

  <!-- SIGN UP FORM -->
  <div class="card" id="signupCard">
    <div class="card-title">Mag-apply bilang Rider 🛵</div>
    <div class="card-sub">Punan ang lahat ng impormasyon</div>
    <div class="msg" id="msg"></div>

    <div class="section-label">Personal Info</div>
    <div class="field"><label>Buong Pangalan</label><input type="text" id="name" placeholder="Juan dela Cruz"/></div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="juan@gmail.com"/></div>
    <div class="field"><label>Phone Number</label><input type="tel" id="phone" placeholder="09xxxxxxxxx"/></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="Minimum 6 characters"/></div>

    <hr class="divider" style="margin:16px 0"/>

    <div class="section-label">Motor Info</div>
    <div class="field"><label>Motor Model</label><input type="text" id="motor" placeholder="Honda Click 125, Yamaha Mio…"/></div>
    <div class="field"><label>Plate Number</label><input type="text" id="plate" placeholder="ABC 1234"/></div>

    <button class="btn" id="signupBtn" onclick="signUp()">Mag-Submit ng Application</button>
  </div>

  <div class="footer">
    May account na? <a href="/Hatidgo/index.html">Mag-login dito →</a>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://wholbbjtdzbqycczlcss.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_yZCqrUNwBQPyTsuwrTWLHg_GTAjW5ui';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function signUp() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const motor = document.getElementById('motor').value.trim();
    const plate = document.getElementById('plate').value.trim();
    const btn = document.getElementById('signupBtn');
    const msg = document.getElementById('msg');

    if (!name || !email || !phone || !password) {
      msg.textContent = 'Punan ang lahat ng required fields.';
      msg.className = 'msg show error'; return;
    }
    if (password.length < 6) {
      msg.textContent = 'Minimum 6 characters ang password.';
      msg.className = 'msg show error'; return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Nagsu-submit…';
    msg.classList.remove('show');

    const { data, error } = await db.auth.signUp({ email, password });

    if (error) {
      msg.textContent = 'Error: ' + error.message;
      msg.className = 'msg show error';
      btn.disabled = false; btn.textContent = 'Mag-Submit ng Application'; return;
    }

    if (data.user) {
      await db.from('users').upsert({
        id: data.user.id,
        name, email, phone,
        motor_model: motor || null,
        plate_number: plate || null,
        role: 'pending_rider', // pending muna hanggang hindi pa naaprubahan
        is_available: false
      });

      // Sign out after registration
      await db.auth.signOut();
    }

    document.getElementById('signupCard').style.display = 'none';
    document.getElementById('pendingBox').classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Mag-Submit ng Application';
  }
</script>
</body>
</html>
