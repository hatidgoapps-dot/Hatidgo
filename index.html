<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>HatidGo – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #2a2a2a;
      --accent: #f97316;
      --accent2: #fbbf24;
      --text: #f0f0f0;
      --muted: #777;
      --red: #ef4444;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 20px;
    }
    .wrap {
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column;
      align-items: center; gap: 32px;
    }
    /* LOGO */
    .logo-area { text-align: center; }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 36px; font-weight: 800;
      letter-spacing: -1px;
    }
    .logo span { color: var(--accent); }
    .logo-sub {
      font-size: 13px; color: var(--muted);
      margin-top: 4px; letter-spacing: 2px;
      text-transform: uppercase;
    }
    .city-pill {
      display: inline-block;
      background: rgba(249,115,22,0.12);
      border: 1px solid rgba(249,115,22,0.3);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px; font-weight: 600;
      color: var(--accent);
      margin-top: 10px;
    }
    /* CARD */
    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
    }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 800;
      margin-bottom: 6px;
    }
    .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    /* INPUTS */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input {
      width: 100%;
      background: #1a1a1a;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: #444; }
    /* BTN */
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 13px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s, transform 0.12s;
      letter-spacing: 0.3px;
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* ERROR */
    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 14px;
      display: none;
    }
    .error-box.show { display: block; }
    /* SPINNER */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* FOOTER */
    .footer { font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="logo-area">
    <div class="logo">🛵 Hatid<span>Go</span></div>
    <div class="logo-sub">Motor · Sasakyan · Mabilis</div>
    <div class="city-pill">📍 Cotabato City</div>
  </div>

  <div class="card">
    <div class="card-title">Mag-Login 🔐</div>
    <div class="card-sub">Para sa Admin at Rider lang</div>

    <div class="error-box" id="errorBox"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@hatidgo.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>

    <button class="btn" id="loginBtn" onclick="login()">Mag-Login</button>
  </div>

  <div class="footer">HatidGo © 2026 · Para sa bawat Pilipino</div>

</div>

<script>
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Auto-redirect if already logged in
  db.auth.getSession().then(async ({ data: { session } }) => {
    if (session) await redirect(session.user.id);
  });

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('errorBox');

    if (!email || !password) {
      showError('Punan ang lahat ng fields.'); return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Naglo-login…';
    errBox.classList.remove('show');

    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Mali ang email o password.');
      btn.disabled = false;
      btn.textContent = 'Mag-Login';
      return;
    }

    await redirect(data.user.id);
  }

  async function redirect(userId) {
    const { data } = await db.from('users').select('role').eq('id', userId).single();
    if (data?.role === 'admin') {
      window.location.href = 'admin.html';
    } else if (data?.role === 'rider') {
      window.location.href = 'rider.html';
    } else {
      showError('Walang access ang account na ito.');
      await db.auth.signOut();
    }
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.add('show');
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Mag-Login';
  }

  // Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
