<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>DG Inventory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#111;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:68px}
input,select,button{font-family:inherit}
input::placeholder{color:#aaa}
.screen{display:none}.screen.active{display:block}

/* LOGIN */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;background:#f8f8f8}
.login h1{font-size:22px;font-weight:800;margin-bottom:4px}
.login p{font-size:13px;color:#888;margin-bottom:28px}
.login input{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:13px 14px;font-size:15px;outline:none;margin-bottom:10px;background:#fff}
.login input:focus{border-color:#0ea5e9}
.login button{width:100%;background:#0ea5e9;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.login button:active{opacity:.85}
.lerr{color:#e33;font-size:13px;margin-top:10px;min-height:18px;text-align:center}

/* HEADER */
.hdr{background:#fff;border-bottom:1px solid #e2e8f0;padding:13px 16px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px}
.htitle{font-size:17px;font-weight:800;flex:1}
.abadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fff8dc;color:#8a6000}
.sbadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#e8f4ff;color:#0069b0}
.btn-add{background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.btn-logout{background:none;border:none;font-size:20px;cursor:pointer}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:50}
.nb{flex:1;background:none;border:none;padding:10px 4px 14px;cursor:pointer;font-size:10px;font-weight:700;color:#bbb;border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.nb .ni{font-size:19px}
.nb.on{color:#0ea5e9;border-top-color:#0ea5e9}

/* CATEGORY TABS */
.ctabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 8px;border-bottom:1px solid #f0f0f0}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;border:1.5px solid #e0e0e0;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;color:#555;white-space:nowrap}
.ctab.on{background:#0ea5e9;color:#fff;border-color:#0ea5e9}

/* SEARCH */
.sw{padding:10px 14px 4px}
.si{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:9px 13px;font-size:14px;outline:none;color:#111;background:#fafafa}
.si:focus{border-color:#0ea5e9;background:#fff}

/* ITEMS */
.list{padding:8px 14px 0}
.icard{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:12px;margin-bottom:7px;background:#fff;cursor:pointer;border:1.5px solid #e2e8f0}
.icard:active{background:#f8fafc}
.icard.out{border-color:#f87171;background:#fff8f8}
.iem{font-size:22px;width:34px;text-align:center;flex-shrink:0}
.iname{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isub{font-size:11px;color:#888;margin-top:2px}
.iqty{font-size:20px;font-weight:800;line-height:1;text-align:right;flex-shrink:0}
.iqty.out{color:#dc2626}
.itag{font-size:9px;font-weight:700;text-align:right;margin-top:2px;color:#dc2626}

/* SHEET */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:12px 18px 38px;max-height:90vh;overflow-y:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sh{animation:up .18s ease}
.shdl{width:36px;height:3px;background:#ddd;border-radius:2px;margin:0 auto 14px}
.shn{font-size:17px;font-weight:800;margin-bottom:2px}
.shm{font-size:13px;color:#888;margin-bottom:14px}

/* STEPPER */
.stpr{display:flex;align-items:center;border:1.5px solid #e0e0e0;border-radius:10px;overflow:hidden;margin-bottom:12px}
.stpr button{background:none;border:none;font-size:22px;padding:8px 16px;cursor:pointer;color:#111;font-weight:700}
.stpr button:active{background:#f5f5f5}
.stpr input{flex:1;border:none;font-size:21px;font-weight:800;text-align:center;outline:none;color:#111;padding:8px 0}

/* FORM */
.lbl{font-size:11px;font-weight:700;color:#888;margin-bottom:3px;display:block;margin-top:10px}
.fi{width:100%;border:1.5px solid #e0e0e0;border-radius:9px;padding:10px 12px;font-size:14px;outline:none;color:#111;background:#fff}
.fi:focus{border-color:#0ea5e9}
select.fi option{background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}

/* BUTTONS */
.btn{border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:10px}
.btn:active{opacity:.85}
.btn-blue{background:#0ea5e9;color:#fff}
.btn-gray{background:#f0f0f0;color:#111;border:1.5px solid #e0e0e0}
.btn-red{background:none;border:none;color:#e33;font-size:13px;cursor:pointer;padding:9px;width:100%;margin-top:2px}
.btn-ghost{background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;padding:9px;width:100%}

/* PRICE BOX */
.pbox{background:#f8f8f8;border-radius:10px;padding:10px 13px;margin-bottom:12px}
.pr{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}

/* ORDER TAB */
.ord-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:13px;margin-bottom:8px;border:1.5px solid #e0e0e0}

/* HISTORY */
.dw{margin-bottom:12px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;margin-bottom:4px}
.dn{font-size:12px;font-weight:800;color:#555}
.dr{font-size:12px;font-weight:800;color:#16a34a}
.lc{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border-radius:10px;margin:0 14px 5px;border:1px solid #f0f0f0}

/* USERS */
.uc{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#f9f9f9;border-radius:11px;margin-bottom:7px;border:1px solid #eee;flex-wrap:wrap}

.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:14px;line-height:2}
.sec{font-size:10px;font-weight:700;color:#aaa;padding:8px 14px 4px;letter-spacing:.5px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;z-index:200;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%)}}
.toast{animation:tin .18s ease}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="pg-login" class="screen active">
  <div class="login">
    <div style="font-size:44px;margin-bottom:12px">🔧</div>
    <h1>Doctor Gadget</h1>
    <p>Inventory System</p>
    <input id="lem" placeholder="Email o Username"/>
    <input id="lpw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">Login</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="pg-admin" class="screen">
  <div class="hdr">
    <div class="htitle">Doctor Gadget</div>
    <span class="abadge" id="aname">Admin</span>
    <button class="btn-add" id="btn-add" onclick="openAdd()" style="display:none">+ Item</button>
    <button class="btn-logout" onclick="doLogout()">👋</button>
  </div>

  <!-- Stock -->
  <div id="av-stock" style="display:none">
    <div class="ctabs" id="a-cats"></div>
    <div class="sw"><input class="si" placeholder="🔍 Hanapin..." oninput="doSearch(this.value)"/></div>
    <div class="list" id="a-list"></div>
  </div>

  <!-- History -->
  <div id="av-history" style="display:none;padding-top:8px">
    <div class="sec">📅 BENTA PER ARAW</div>
    <div id="a-logs"></div>
  </div>

  <!-- Order -->
  <div id="av-order" style="display:none;padding:10px 14px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;color:#555">🛒 Para sa Supplier</div>
      <div style="display:flex;gap:6px">
        <button onclick="copyOrder()" style="background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer">📋 Copy</button>
        <button onclick="resetOrder()" style="background:#f0f0f0;color:#555;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer">↺ Reset</button>
      </div>
    </div>
    <div id="a-order-list"></div>
  </div>

  <!-- Users -->
  <div id="av-users" style="display:none;padding:8px 14px 0">
    <div class="sec" style="padding:0 0 8px">👥 MGA STAFF</div>
    <div id="a-ulist"></div>
    <button class="btn btn-blue" onclick="openNewStaff()">➕ Gawa ng Staff Account</button>
  </div>

  <nav class="nav">
    <button class="nb on" id="na-s" onclick="atab('stock')"><span class="ni">📦</span>Stock</button>
    <button class="nb"    id="na-h" onclick="atab('history')"><span class="ni">📅</span>History</button>
    <button class="nb"    id="na-o" onclick="atab('order')"><span class="ni">🛒</span>Order</button>
    <button class="nb"    id="na-u" onclick="atab('users')"><span class="ni">👥</span>Users</button>
  </nav>
</div>

<!-- STAFF -->
<div id="pg-staff" class="screen">
  <div class="hdr">
    <div class="htitle">Doctor Gadget</div>
    <span class="sbadge" id="sname">Staff</span>
    <button class="btn-logout" onclick="doLogout()">👋</button>
  </div>
  <div id="sv-stock" style="display:none">
    <div class="ctabs" id="s-cats"></div>
    <div class="sw"><input class="si" placeholder="🔍 Hanapin..." oninput="doSearch(this.value)"/></div>
    <div class="list" id="s-list"></div>
  </div>
  <div id="sv-history" style="display:none;padding-top:8px">
    <div class="sec">📅 AKING BENTA NGAYON</div>
    <div id="s-logs"></div>
  </div>
  <nav class="nav">
    <button class="nb on" id="ns-s" onclick="stab('stock')"><span class="ni">📦</span>Stock</button>
    <button class="nb"    id="ns-h" onclick="stab('history')"><span class="ni">📅</span>History</button>
  </nav>
</div>

<!-- MODAL -->
<div class="ov" id="ov" style="display:none" onclick="bgc(event)"><div class="sh" id="sh"></div></div>

<script>
// ─── CREDENTIALS ──────────────────────────────────────
const SB_URL='https://sivnejgshvmlpribuydl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpdm5lamdzaHZtbHByaWJ1eWRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NzE1MzUsImV4cCI6MjA5ODA0NzUzNX0.rHYKO45RkpmUs61dQ1h46c_go7QA2Ps1C8Bc-rg0-rU';
const SB_SVC='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpdm5lamdzaHZtbHByaWJ1eWRsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MjQ3MTUzNSwiZXhwIjoyMDk4MDQ3NTM1fQ.9ezpZMZGZP7XQbSW4h57CklJmhoYl4E6jmYaRicJp1E';
// ──────────────────────────────────────────────────────

const sb=supabase.createClient(SB_URL,SB_KEY);
let me,items=[],logs=[],doneItems=[];
let q='',cat='All',aid=null;

const CATS={'LCD / Display':'📱','Flex Cable':'🔗','Battery':'🔋','Charger':'⚡','Casing / Cover':'📦','Tools / Parts':'🔧','Accessories':'🎧','Others':'🗂️'};
const CK=Object.keys(CATS);
const ic=c=>CATS[c]||'📦';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ts=()=>{const d=new Date();return{date:d.toISOString().slice(0,10),time:d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})};};
const td=()=>new Date().toISOString().slice(0,10);
const P=n=>'₱'+Number(n||0).toLocaleString('en-PH');
const pg=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('pg-'+id).classList.add('active');};

// ── AUTH ───────────────────────────────────────────────
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await go(session.user);
  else pg('login');
}

async function doLogin(){
  let e=document.getElementById('lem').value.trim();
  const p=document.getElementById('lpw').value;
  document.getElementById('lerr').textContent='';
  if(!e||!p){document.getElementById('lerr').textContent='Kumpleto ang email at password.';return;}
  if(!e.includes('@')) e=e.toLowerCase()+'@doctorgadget.staff';
  const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error){document.getElementById('lerr').textContent='Mali ang email o password.';return;}
  await go(data.user);
}

async function go(user){
  const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();
  me=data||{id:user.id,name:user.email,role:'staff'};
  await load();
  doneItems=JSON.parse(localStorage.getItem('dg_done')||'[]');
  if(me.role==='admin'){
    document.getElementById('aname').textContent='👑 '+me.name;
    pg('admin');atab('stock');
  } else {
    document.getElementById('sname').textContent='👤 '+me.name;
    pg('staff');stab('stock');
  }
}

async function doLogout(){await sb.auth.signOut();me=null;items=[];logs=[];pg('login');}

async function load(){
  const [ir,lr]=await Promise.all([
    sb.from('items').select('*').order('name'),
    sb.from('logs').select('*').order('created_at',{ascending:false}).limit(300)
  ]);
  if(ir.data) items=ir.data;
  if(lr.data) logs=lr.data;
}

// ── ADMIN TABS ─────────────────────────────────────────
function atab(t){
  ['stock','history','order','users'].forEach(x=>{
    document.getElementById('av-'+x).style.display=x===t?'':'none';
    const nb=document.getElementById('na-'+x[0]);
    if(nb) nb.className='nb'+(x===t?' on':'');
  });
  document.getElementById('btn-add').style.display=t==='stock'?'':'none';
  cat='All'; q='';
  if(t==='stock'){rCats('a-cats','admin');rAdmin();}
  if(t==='history') rHist('admin');
  if(t==='order') rOrder();
  if(t==='users') rUsers();
}

function stab(t){
  ['stock','history'].forEach(x=>{
    document.getElementById('sv-'+x).style.display=x===t?'':'none';
    const nb=document.getElementById('ns-'+x[0]);
    if(nb) nb.className='nb'+(x===t?' on':'');
  });
  cat='All'; q='';
  if(t==='stock'){rCats('s-cats','staff');rStaff();}
  if(t==='history') rHist('staff');
}

// ── CATEGORY TABS ──────────────────────────────────────
function rCats(el,role){
  document.getElementById(el).innerHTML=['All',...CK].map(c=>{
    const label=c==='All'?'🔠 Lahat':ic(c)+' '+c.split('/')[0].trim();
    return '<button class="ctab'+(cat===c?' on':'')+'" onclick="setC(\''+c.replace(/'/g,"\\'")+"','"+role+"'\")>"+label+'</button>';
  }).join('');
}
function setC(c,role){
  cat=c;
  if(role==='admin'){rCats('a-cats','admin');rAdmin();}
  else{rCats('s-cats','staff');rStaff();}
}
function doSearch(v){q=v;me&&me.role==='admin'?rAdmin():rStaff();}

// ── ADMIN STOCK ────────────────────────────────────────
function rAdmin(){
  const fil=items.filter(i=>(cat==='All'||i.category===cat)&&i.name.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('a-list').innerHTML=fil.length===0
    ?'<div class="empty">Wala pang items.<br>I-tap ang <b>+ Item</b></div>'
    :fil.map(i=>{
      const isOut=i.qty===0;
      return '<div class="icard'+(isOut?' out':'')+'" onclick="openA(\''+i.id+'\')">'+
        '<div class="iem">'+ic(i.category)+'</div>'+
        '<div style="flex:1;min-width:0"><div class="iname">'+esc(i.name)+'</div>'+
        '<div class="isub">Cost: '+P(i.cost)+' · Admin: '+P(i.admin_price)+' · Staff: '+P(i.staff_price)+'</div></div>'+
        '<div style="text-align:right"><div class="iqty'+(isOut?' out':'')+'">'+i.qty+'<span style="font-size:10px;font-weight:400;color:#aaa"> '+esc(i.unit)+'</span></div>'+
        (isOut?'<div class="itag">WALA NA</div>':'')+
        '</div></div>';
    }).join('');
}

// ── STAFF STOCK ────────────────────────────────────────
function rStaff(){
  const fil=items.filter(i=>i.qty>0&&(cat==='All'||i.category===cat)&&i.name.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('s-list').innerHTML=fil.length===0
    ?'<div class="empty">Walang available na items.</div>'
    :fil.map(i=>'<div class="icard" onclick="openS(\''+i.id+'\')">'+
        '<div class="iem">'+ic(i.category)+'</div>'+
        '<div style="flex:1;min-width:0"><div class="iname">'+esc(i.name)+'</div>'+
        '<div class="isub">'+esc(i.category)+'</div></div>'+
        '<div style="text-align:right"><div class="iqty">'+i.qty+'<span style="font-size:10px;font-weight:400;color:#aaa"> '+esc(i.unit)+'</span></div></div>'+
      '</div>').join('');
}

// ── ITEM SHEETS ────────────────────────────────────────
function openA(id){
  aid=id; const i=items.find(x=>x.id===id);
  modal('<div class="shdl"></div>'+
    '<div class="shn">'+esc(i.name)+'</div>'+
    '<div class="shm">'+ic(i.category)+' '+esc(i.category)+' · '+i.qty+' '+esc(i.unit)+' natitira</div>'+
    '<div class="pbox">'+
      '<div class="pr"><span style="color:#888">Supplier Cost</span><span style="font-weight:700">'+P(i.cost)+'</span></div>'+
      '<div class="pr"><span style="color:#888">Admin Price</span><span style="font-weight:700;color:#0ea5e9">'+P(i.admin_price)+'</span></div>'+
      '<div class="pr"><span style="color:#888">Staff Price</span><span style="font-weight:700;color:#666">'+P(i.staff_price)+'</span></div>'+
    '</div>'+
    '<label class="lbl" style="margin-top:0">Quantity</label>'+
    '<div class="stpr"><button onclick="sq(-1)">−</button><input type="number" id="qv" value="1" min="1"/><button onclick="sq(1)">＋</button></div>'+
    '<div class="g2"><button class="btn btn-blue" onclick="doSell()">📤 Ibenta</button>'+
    '<button class="btn btn-gray" onclick="doAdd()">📥 Dagdag</button></div>'+
    '<button class="btn-ghost" onclick="openEdit(\''+id+'\')">✏️ I-edit</button>');
}

function openS(id){
  aid=id; const i=items.find(x=>x.id===id);
  modal('<div class="shdl"></div>'+
    '<div class="shn">'+esc(i.name)+'</div>'+
    '<div class="shm">'+ic(i.category)+' · Natitira: <strong>'+i.qty+' '+esc(i.unit)+'</strong></div>'+
    '<label class="lbl" style="margin-top:0">Quantity na ibebenta</label>'+
    '<div class="stpr"><button onclick="sq(-1)">−</button><input type="number" id="qv" value="1" min="1"/><button onclick="sq(1)">＋</button></div>'+
    '<button class="btn btn-blue" onclick="doSell()">📤 Ibenta</button>');
}

function sq(d){const el=document.getElementById('qv');el.value=Math.max(1,parseInt(el.value||1)+d);}
function gq(){return Math.max(1,parseInt(document.getElementById('qv').value)||1);}

// ── SELL ───────────────────────────────────────────────
async function doSell(){
  const it=items.find(i=>i.id===aid),q=gq();
  if(q>it.qty){toast('❌ Hindi sapat ang stock!');return;}
  const isA=me.role==='admin',pr=isA?it.admin_price:it.staff_price,nq=it.qty-q,{date,time}=ts();
  const lg={id:uid(),item_id:aid,item_name:it.name,type:'sell',qty:q,price_used:pr,seller_name:me.name,seller_role:me.role,date:date,time:time};
  const [r1,r2]=await Promise.all([sb.from('items').update({qty:nq}).eq('id',aid),sb.from('logs').insert(lg)]);
  if(r1.error||r2.error){toast('❌ Error! Subukan ulit.');return;}
  closeSheet();
  items=items.map(i=>i.id===aid?Object.assign({},i,{qty:nq}):i);
  logs.unshift(lg);
  isA?rAdmin():rStaff();
  toast('✅ Nabenta: '+it.name+' x'+q);
}

// ── ADD STOCK ──────────────────────────────────────────
async function doAdd(){
  const it=items.find(i=>i.id===aid),q=gq(),nq=it.qty+q,{date,time}=ts();
  const lg={id:uid(),item_id:aid,item_name:it.name,type:'add',qty:q,price_used:0,seller_name:me.name,seller_role:'admin',date:date,time:time};
  const [r1,r2]=await Promise.all([sb.from('items').update({qty:nq}).eq('id',aid),sb.from('logs').insert(lg)]);
  if(r1.error||r2.error){toast('❌ Error! Subukan ulit.');return;}
  closeSheet();
  items=items.map(i=>i.id===aid?Object.assign({},i,{qty:nq}):i);
  logs.unshift(lg);
  rAdmin();
  toast('📥 Nadagdag: '+it.name+' x'+q);
}

async function saveAdd(){

  const it={id:uid(),name:name,category:document.getElementById('fc').value,
    qty:parseInt(document.getElementById('fq').value)||0,
    low_at:parseInt(document.getElementById('fl').value)||2,

    admin_price:parseFloat(document.getElementById('fap').value)||0,
    staff_price:parseFloat(document.getElementById('fsp').value)||0,

// ── EDIT ITEM ──────────────────────────────────────────

    '<select class="fi" id="ec">'+CK.map(c=>'<option value="'+c+'"'+(i.category===c?' selected':'')+'>'+ic(c)+' '+c+'</option>').join('')+'</select>'+

async function saveEdit(id){
  const upd={name:document.getElementById('en').value.trim(),category:document.getElementById('ec').value,
    qty:parseInt(document.getElementById('eq').value)||0,low_at:parseInt(document.getElementById('el').value)||2,
    cost:parseFloat(document.getElementById('eco').value)||0,admin_price:parseFloat(document.getElementById('eap').value)||0,
    staff_price:parseFloat(document.getElementById('esp').value)||0,unit:document.getElementById('eu').value.trim()||'pcs'};
  if(!upd.name){toast('❌ Lagyan ng pangalan!');return;}
  const {error}=await sb.from('items').update(upd).eq('id',id);
  if(error){toast('❌ '+error.message);return;}
  closeSheet();
  items=items.map(i=>i.id===id?Object.assign({},i,upd):i);
  rAdmin();
  toast('✅ Updated!');
}

async function delItem(id){
  if(!confirm('I-delete ba?')) return;
  await sb.from('items').delete().eq('id',id);
  closeSheet();
  items=items.filter(i=>i.id!==id);
  rAdmin();
  toast('🗑️ Deleted.');
}

// ── ORDER TAB ──────────────────────────────────────────
async function rOrder(){
  doneItems=JSON.parse(localStorage.getItem('dg_done')||'[]');
  const el=document.getElementById('a-order-list');
  el.innerHTML='<div style="text-align:center;padding:20px;color:#aaa">Loading...</div>';
  const {data,error}=await sb.from('logs').select('item_id,item_name,qty').eq('type','sell');
  if(error){el.innerHTML='<div class="empty">'+error.message+'</div>';return;}
  if(!data||data.length===0){el.innerHTML='<div class="empty">Wala pang nabenta.<br>Mag-benta muna para lumabas dito.</div>';return;}
  const sm={};
  data.forEach(function(l){if(!sm[l.item_id])sm[l.item_id]={name:l.item_name,qty:0};sm[l.item_id].qty+=l.qty;});
  const toOrder=Object.entries(sm).filter(function(e){return doneItems.indexOf(e[0])<0;}).sort(function(a,b){return b[1].qty-a[1].qty;});
  if(toOrder.length===0){
    el.innerHTML='<div class="empty">Lahat ay na-order na! ✅<br><br><button onclick="resetOrder()" style="background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer">↺ I-Reset</button></div>';
    return;
  }
  el.innerHTML=toOrder.map(function(entry){
    const id=entry[0],info=entry[1];
    const item=items.find(function(i){return i.id===id;});
    const stock=item?item.qty:0;
    const cat=item?ic(item.category):'📦';
    return '<div class="ord-item">'+
      '<div style="font-size:22px">'+cat+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(info.name)+'</div>'+
        '<div style="font-size:12px;color:#aaa;margin-top:2px">Nabenta: <strong style="color:#0ea5e9">'+info.qty+'</strong> · Stock: '+stock+'</div>'+
      '</div>'+
      '<button onclick="markDone(\''+id+'\')" style="flex-shrink:0;background:#10b981;color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer">✅ Done</button>'+
    '</div>';
  }).join('');
}

function markDone(id){
  if(doneItems.indexOf(id)<0) doneItems.push(id);
  localStorage.setItem('dg_done',JSON.stringify(doneItems));
  rOrder();
}

function resetOrder(){
  doneItems=[];
  localStorage.setItem('dg_done',JSON.stringify(doneItems));
  rOrder();
  toast('↺ Reset!');
}

async function copyOrder(){
  const {data}=await sb.from('logs').select('item_id,item_name,qty').eq('type','sell');
  if(!data||data.length===0){toast('Walang items!');return;}
  const sm={};
  data.forEach(function(l){if(!sm[l.item_id])sm[l.item_id]={name:l.item_name,qty:0};sm[l.item_id].qty+=l.qty;});
  const toOrder=Object.entries(sm).filter(function(e){return doneItems.indexOf(e[0])<0;}).sort(function(a,b){return b[1].qty-a[1].qty;});
  if(toOrder.length===0){toast('Walang items!');return;}
  const text='ORDER LIST - Doctor Gadget\n'+toOrder.map(function(e){return '• '+e[1].name+' - '+e[1].qty;}).join('\n');
  navigator.clipboard.writeText(text).then(function(){toast('📋 Na-copy!');});
}

// ── USERS ──────────────────────────────────────────────
async function rUsers(){
  const {data}=await sb.from('profiles').select('*').order('created_at');
  document.getElementById('a-ulist').innerHTML=(data||[]).map(function(p){
    const roleBtn=p.id!==me.id
      ?'<button onclick="toggleR(\''+p.id+'\',\''+(p.role==='staff'?'admin':'staff')+'\')" style="font-size:11px;border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:700;'+(p.role==='staff'?'background:#fffbdc;color:#8a6000':'background:#e8f4ff;color:#0069b0')+'">'+(p.role==='staff'?'→ Admin':'→ Staff')+'</button>'
        +'<button onclick="openChgPass(\''+p.id+'\',\''+esc(p.name)+'\')" style="font-size:11px;border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:700;background:#f0f0f0;color:#333">🔑 Pass</button>'
        +'<button onclick="delStaff(\''+p.id+'\',\''+esc(p.name)+'\')" style="font-size:11px;border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:700;background:#ffe4e4;color:#c00">🗑️</button>'
      :'<span style="font-size:11px;color:#bbb">Ikaw</span>';
    return '<div class="uc"><div style="font-size:22px">'+(p.role==='admin'?'👑':'👤')+'</div>'+
      '<div style="flex:1"><div style="font-weight:700;font-size:14px">'+esc(p.name)+'</div><div style="font-size:11px;color:#aaa">'+(p.role==='admin'?'Admin':'Staff')+'</div></div>'+
      roleBtn+'</div>';
  }).join('');
}

async function toggleR(id,role){await sb.from('profiles').update({role:role}).eq('id',id);toast('✅ Updated!');rUsers();}

function openNewStaff(){
  modal('<div class="shdl"></div><div class="shn" style="margin-bottom:4px">Gawa ng Staff Account</div>'+
    '<div style="font-size:13px;color:#888;margin-bottom:14px">Username at password lang</div>'+
    '<label class="lbl" style="margin-top:0">Username</label><input class="fi" id="nn" placeholder="e.g. maria"/>'+
    '<label class="lbl">Password</label><input class="fi" id="np" placeholder="e.g. 123456"/>'+
    '<button class="btn btn-blue" id="nsb" onclick="newStaff()">✅ Gawa ng Account</button>'+
    '<div id="nse" style="color:#e33;font-size:13px;margin-top:8px;text-align:center"></div>');
}

async function newStaff(){
  const n=document.getElementById('nn').value.trim().toLowerCase();
  const p=document.getElementById('np').value.trim();
  const e=n+'@doctorgadget.staff';
  const err=document.getElementById('nse');
  err.textContent='';
  if(!n||!p){err.textContent='Kumpleto ang fields.';return;}
  if(p.length<4){err.textContent='Minimum 4 characters ang password.';return;}
  document.getElementById('nsb').textContent='⏳ Ginagawa...';
  const res=await fetch(SB_URL+'/auth/v1/admin/users',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_SVC,'apikey':SB_SVC},
    body:JSON.stringify({email:e,password:p,email_confirm:true,user_metadata:{name:n}})});
  const json=await res.json();
  if(!res.ok){err.textContent=json.message||'Error';document.getElementById('nsb').textContent='✅ Gawa ng Account';return;}
  if(json.id){await new Promise(function(r){setTimeout(r,800);});await sb.from('profiles').update({name:n,role:'staff'}).eq('id',json.id);}
  closeSheet();
  toast('✅ Account ni '+n+' nagawa na!');
  rUsers();
}

function openChgPass(uid,uname){
  modal('<div class="shdl"></div><div class="shn" style="margin-bottom:4px">Palitan ang Password</div>'+
    '<div style="font-size:13px;color:#888;margin-bottom:14px">User: <strong>'+uname+'</strong></div>'+
    '<label class="lbl" style="margin-top:0">Bagong Password</label><input class="fi" id="cp" placeholder="e.g. 123456"/>'+
    '<button class="btn btn-blue" id="cpb" onclick="chgPass(\''+uid+'\')">✅ I-Update</button>'+
    '<div id="cpe" style="color:#e33;font-size:13px;margin-top:8px;text-align:center"></div>');
}

async function chgPass(uid){
  const p=document.getElementById('cp').value.trim();
  if(!p){document.getElementById('cpe').textContent='Lagyan ng password.';return;}
  document.getElementById('cpb').textContent='⏳ Ginagawa...';
  const res=await fetch(SB_URL+'/auth/v1/admin/users/'+uid,{method:'PUT',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_SVC,'apikey':SB_SVC},
    body:JSON.stringify({password:p})});
  if(res.ok){closeSheet();toast('✅ Password updated!');}
  else{const j=await res.json();document.getElementById('cpe').textContent=j.message||'Error';document.getElementById('cpb').textContent='✅ I-Update';}
}

async function delStaff(uid,uname){
  if(!confirm('I-delete si '+uname+'?')) return;
  const res=await fetch(SB_URL+'/auth/v1/admin/users/'+uid,{method:'DELETE',
    headers:{'Authorization':'Bearer '+SB_SVC,'apikey':SB_SVC}});
  if(res.ok||res.status===200){toast('🗑️ '+uname+' deleted!');rUsers();}
  else toast('❌ Error sa pag-delete.');
}

// ── HISTORY ────────────────────────────────────────────
function rHist(role){
  const ml=role==='staff'?logs.filter(function(l){return l.seller_name===me.name&&l.date===td();}):logs;
  const bd={};
  ml.forEach(function(l){if(!bd[l.date])bd[l.date]=[];bd[l.date].push(l);});
  const t=td();
  function dlabel(d){return d===t?'🟢 Ngayon':new Date(d+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',weekday:'short'});}
  let h='';
  if(!Object.keys(bd).length){h='<div class="empty">Wala pang transactions.</div>';}
  else{
    Object.entries(bd).sort(function(a,b){return b[0].localeCompare(a[0]);}).forEach(function(entry){
      const date=entry[0],ents=entry[1];
      const sells=ents.filter(function(e){return e.type==='sell';});
      const rev=sells.reduce(function(s,e){return s+(e.price_used||0)*e.qty;},0);
      h+='<div class="dw"><div class="dh"><div><div class="dn">'+dlabel(date)+' · '+sells.length+' benta</div></div>'+
        (role==='admin'&&rev>0?'<div class="dr">'+P(rev)+'</div>':'')+
        '</div>';
      ents.sort(function(a,b){return (b.time||'').localeCompare(a.time||'');}).forEach(function(l){
        const is=l.type==='sell';
        h+='<div class="lc">'+
          '<div style="font-size:19px;width:26px;text-align:center;flex-shrink:0">'+(is?'📤':'📥')+'</div>'+
          '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l.item_name)+'</div>'+
          '<div style="font-size:10px;color:#aaa;margin-top:1px">'+(l.time||'')+' · '+esc(l.seller_name||'')+'</div></div>'+
          '<div style="text-align:right;flex-shrink:0"><div style="font-weight:800;font-size:14px;color:'+(is?'#0ea5e9':'#16a34a')+'">'+(is?'-':'+')+l.qty+'</div>'+
          (role==='admin'&&is&&l.price_used?'<div style="font-size:10px;color:#aaa">'+P(l.price_used*l.qty)+'</div>':'')+
          '</div></div>';
      });
      h+='</div>';
    });
  }
  document.getElementById(role==='admin'?'a-logs':'s-logs').innerHTML=h;
}

// ── MODAL ──────────────────────────────────────────────
function bgc(e){if(e.target===document.getElementById('ov'))closeSheet();}
function closeSheet(){document.getElementById('ov').style.display='none';document.getElementById('sh').innerHTML='';}
function modal(h){document.getElementById('sh').innerHTML=h;document.getElementById('ov').style.display='flex';}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}

init();
</script>
